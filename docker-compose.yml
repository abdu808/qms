version: "3.9"

services:
  qms-db:
    image: postgres:16-alpine
    container_name: qms-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LANG: ar_SA.UTF-8
      LC_ALL: ar_SA.UTF-8
    volumes:
      - qms_db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qms-net

  qms-api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: qms-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      qms-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_SECRET: ${REFRESH_SECRET}
      REFRESH_EXPIRES_IN: ${REFRESH_EXPIRES_IN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      QM_PASSWORD: ${QM_PASSWORD}
      APP_NAME: ${APP_NAME}
      APP_URL: ${APP_URL}
      PORT: ${PORT}
      QMS_BACKUP: ${QMS_BACKUP:-on}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      QMS_BACKUP_DIR: ${QMS_BACKUP_DIR:-/app/uploads/backups}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      QM_EMAIL: ${QM_EMAIL:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_FROM_JSON: ${SEED_FROM_JSON:-off}
    volumes:
      - qms_uploads:/app/uploads
      - ./backups:/app/uploads/backups
    expose:
      - "3000"
    networks:
      - qms-net
    healthcheck:
      # الـ migrations تعمل قبل الخادم — start_period=180s يمنحها وقتاً كافياً
      test: ["CMD-SHELL", "wget -qO- --timeout=5 http://localhost:3000/api/health 2>/dev/null | grep -q '\"ok\"' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 180s

  # qms-web (nginx) محذوف — Express يخدم الواجهة مباشرةً من /web/public
  # في Coolify: غيّر الـ Port من 80 (qms-web) إلى 3000 (qms-api)

volumes:
  qms_db_data:
  qms_uploads:

networks:
  qms-net:
    driver: bridge
