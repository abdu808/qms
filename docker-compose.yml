version: "3.9"

services:
  qms-db:
    image: postgres:16-alpine
    container_name: qms-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LANG: ar_SA.UTF-8
      LC_ALL: ar_SA.UTF-8
    volumes:
      - qms_db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qms-net

  qms-api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: qms-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      qms-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_SECRET: ${REFRESH_SECRET}
      REFRESH_EXPIRES_IN: ${REFRESH_EXPIRES_IN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      QM_PASSWORD: ${QM_PASSWORD}
      APP_NAME: ${APP_NAME}
      APP_URL: ${APP_URL}
      PORT: ${PORT}
      # Backup (يُشغَّل من داخل scheduler.js في الـ API بعد 02:00 محلياً)
      QMS_BACKUP: ${QMS_BACKUP:-on}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      QMS_BACKUP_DIR: ${QMS_BACKUP_DIR:-/app/uploads/backups}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      QM_EMAIL: ${QM_EMAIL:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # SEED_FROM_JSON=on  →  تعبئة seed-data.json عند أول deploy (مرة واحدة فقط)
      # بعد النجاح: أعدها إلى off
      SEED_FROM_JSON: ${SEED_FROM_JSON:-off}
    volumes:
      - qms_uploads:/app/uploads
      - ./backups:/app/uploads/backups
    expose:
      - "3000"
    networks:
      - qms-net
    healthcheck:
      # يقبل 200 (جاهز) و 503 (startup جارٍ) — يفشل فقط إذا Node ميت كلياً (connection refused)
      test: ["CMD-SHELL", "wget -qO- --timeout=5 http://localhost:3000/api/health 2>/dev/null | grep -q '\"ok\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  qms-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: qms-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      qms-api:
        condition: service_healthy
    expose:
      - "80"
    # لا نستخدم ports: لأن Traefik يوصل الـ traffic عبر Docker network مباشرةً
    # ports: - "8080:80"  ← كان يتعارض مع Coolify/Traefik اللي يحجزان 8080 دائماً
    healthcheck:
      # nginx:alpine لا يحتوي wget/curl — نتحقق من PID file بدلاً
      test: ["CMD-SHELL", "cat /var/run/nginx.pid | xargs -r kill -0 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - qms-net

  # النسخ الاحتياطي:
  #   يُشغَّل من داخل scheduler.js في qms-api (QMS_BACKUP=on).
  #   يكتب إلى volume qms_uploads/backups ويُنعكس على المسار المضيف ./backups.
  #   للتحقق: docker exec qms-api ls -la /app/uploads/backups
  # (لا نستخدم حاوية منفصلة لتفادي مشكلة setpgid داخل Alpine.)

volumes:
  qms_db_data:
  qms_uploads:

networks:
  qms-net:
    driver: bridge
