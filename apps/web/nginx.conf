server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker internal DNS — forces nginx to re-resolve container IPs on each
  # request instead of caching at startup (fixes 502/504 after container restarts).
  resolver 127.0.0.11 valid=15s ipv6=off;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # رفع الملفات + محادثة المستشار — تحليل AI يأخذ وقتاً أطول
  location ~ ^/api/consultant/(upload|chat)$ {
    set $api_upstream http://qms-api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";            # keep-alive للـ SSE
    proxy_read_timeout 600s;    # 10 دقائق — كافية لتحليل AI على ملفات كبيرة
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_buffering off;        # ضروري لـ SSE — يمنع nginx من تخزين الـ stream
    proxy_cache off;
    proxy_cache_bypass 1;
    client_max_body_size 50m;   # حتى 50 MB لكل رفع
  }

  # Proxy API to backend container
  # Using a variable forces nginx to use the resolver above instead of
  # caching the upstream IP at startup time.
  location /api/ {
    set $api_upstream http://qms-api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 20m;
  }

  # Proxy public token-based routes
  location ~ ^/(eval|survey|ack)/ {
    set $api_upstream http://qms-api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
