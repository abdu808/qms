<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البوابة المؤسسية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/portal.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    .prose-ar { line-height: 2; white-space: pre-wrap; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800" x-data="portal()" x-init="init()" x-cloak>

  <!-- ══════════════════ HEADER ══════════════════ -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <!-- اسم الجهة -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-blue-700 flex items-center justify-center text-white text-lg font-bold shrink-0">
          <span x-text="settings.orgName?.[0] || '؟'"></span>
        </div>
        <div>
          <h1 class="text-base font-bold text-gray-900 leading-tight" x-text="settings.orgName || 'البوابة المؤسسية'"></h1>
          <p class="text-xs text-gray-500 hidden sm:block" x-text="settings.orgDescription || ''"></p>
        </div>
      </div>
      <!-- زر دخول النظام -->
      <a href="/qms"
         class="shrink-0 inline-flex items-center gap-1.5 bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
        دخول النظام
      </a>
    </div>
  </header>

  <!-- ══════════════════ LOADING ══════════════════ -->
  <div x-show="loading" class="flex justify-center items-center min-h-[60vh]">
    <div class="text-center space-y-3">
      <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
      <p class="text-gray-500 text-sm">جارٍ تحميل المحتوى…</p>
    </div>
  </div>

  <!-- ══════════════════ ERROR ══════════════════ -->
  <div x-show="error && !loading" class="max-w-5xl mx-auto px-4 py-16 text-center">
    <div class="text-5xl mb-4">⚠️</div>
    <p class="text-gray-600" x-text="error"></p>
  </div>

  <!-- ══════════════════ MAIN CONTENT ══════════════════ -->
  <main x-show="!loading && !error" class="max-w-5xl mx-auto px-4 py-8 space-y-8">

    <!-- ─── Hero / وصف مختصر ─── -->
    <section x-show="settings.orgDescription" class="bg-blue-700 rounded-2xl text-white p-6 md:p-8">
      <p class="text-lg leading-relaxed opacity-90" x-text="settings.orgDescription"></p>
    </section>

    <!-- ─── الإعلانات ─── -->
    <section x-show="settings.showAnnouncements && announcements.length > 0">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">📢</span>
        <h2 class="text-xl font-bold text-gray-800">الإعلانات والأخبار</h2>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <template x-for="a in announcements" :key="a.id">
          <article class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition">
            <div class="flex items-start justify-between gap-2 mb-2">
              <h3 class="font-semibold text-gray-900 text-sm leading-snug" x-text="a.title"></h3>
              <span x-show="a.category"
                    class="shrink-0 text-xs bg-blue-50 text-blue-700 border border-blue-100 px-2 py-0.5 rounded-full"
                    x-text="a.category"></span>
            </div>
            <p x-show="a.summary" class="text-sm text-gray-600 mb-3 leading-relaxed" x-text="a.summary"></p>
            <p x-show="!a.summary && a.body" class="text-sm text-gray-600 mb-3 leading-relaxed line-clamp-3" x-text="a.body"></p>
            <time class="text-xs text-gray-400" x-text="formatDate(a.publishedAt)"></time>
          </article>
        </template>
      </div>
    </section>

    <!-- ─── سياسة الجودة ─── -->
    <section x-show="settings.showPolicy && policy">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">📜</span>
        <h2 class="text-xl font-bold text-gray-800">سياسة الجودة</h2>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div class="flex flex-wrap items-center gap-3 mb-4">
          <h3 class="font-bold text-gray-900" x-text="policy?.title"></h3>
          <span class="text-xs bg-green-50 text-green-700 border border-green-200 px-2 py-0.5 rounded-full"
                x-text="'الإصدار ' + (policy?.version || '')"></span>
          <span x-show="policy?.approvedAt" class="text-xs text-gray-400"
                x-text="'اعتُمدت: ' + formatDate(policy?.approvedAt)"></span>
        </div>
        <div class="prose-ar text-gray-700 text-sm" x-text="policy?.content"></div>
        <template x-if="policy?.commitments">
          <div class="mt-4 pt-4 border-t border-gray-100">
            <p class="font-semibold text-gray-800 text-sm mb-2">التعهدات:</p>
            <div class="prose-ar text-gray-600 text-sm" x-text="policy.commitments"></div>
          </div>
        </template>
      </div>
    </section>

    <!-- ─── الوثائق المنشورة ─── -->
    <section x-show="settings.showDocuments && documents.length > 0">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">📄</span>
        <h2 class="text-xl font-bold text-gray-800">الوثائق المنشورة</h2>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="text-right px-4 py-3 font-semibold text-gray-600">الرمز</th>
              <th class="text-right px-4 py-3 font-semibold text-gray-600">العنوان</th>
              <th class="text-right px-4 py-3 font-semibold text-gray-600 hidden sm:table-cell">النوع</th>
              <th class="text-right px-4 py-3 font-semibold text-gray-600 hidden md:table-cell">الإصدار</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
            <template x-for="d in documents" :key="d.id">
              <tr class="hover:bg-gray-50 transition">
                <td class="px-4 py-3 font-mono text-xs text-blue-700" x-text="d.code"></td>
                <td class="px-4 py-3 text-gray-800 font-medium" x-text="d.title"></td>
                <td class="px-4 py-3 text-gray-500 hidden sm:table-cell" x-text="categoryLabel(d.category)"></td>
                <td class="px-4 py-3 text-gray-500 hidden md:table-cell" x-text="d.currentVersion"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ─── الاستبيانات العامة ─── -->
    <section x-show="settings.showSurveys && surveys.length > 0">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">📝</span>
        <h2 class="text-xl font-bold text-gray-800">استبيانات الرضا</h2>
      </div>
      <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
        <template x-for="s in surveys" :key="s.id">
          <a :href="`/survey/${s.id}`"
             class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md hover:border-blue-200 transition group">
            <div class="flex items-start justify-between gap-2 mb-3">
              <h3 class="font-semibold text-gray-900 text-sm group-hover:text-blue-700 transition" x-text="s.title"></h3>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
              <span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full" x-text="targetLabel(s.target)"></span>
              <span x-show="s.period" class="bg-gray-50 text-gray-500 px-2 py-0.5 rounded-full" x-text="s.period"></span>
            </div>
            <p class="text-xs text-blue-600 mt-3 font-medium group-hover:underline">شارك في الاستبيان ←</p>
          </a>
        </template>
      </div>
    </section>

    <!-- ─── حالة فارغة ─── -->
    <section x-show="!announcements.length && !policy && !documents.length && !surveys.length"
             class="text-center py-20">
      <div class="text-6xl mb-4">🏛️</div>
      <h2 class="text-xl font-bold text-gray-700 mb-2" x-text="settings.orgName || 'البوابة المؤسسية'"></h2>
      <p class="text-gray-400">سيتوفر المحتوى المنشور هنا قريباً.</p>
    </section>

  </main>

  <!-- ══════════════════ FOOTER ══════════════════ -->
  <footer class="border-t border-gray-200 bg-white mt-12">
    <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-gray-400">
      <span x-text="settings.footerText || (settings.orgName + ' — نظام إدارة الجودة ISO 9001:2015')"></span>
      <a href="/qms" class="text-blue-600 hover:underline">دخول النظام الداخلي</a>
    </div>
  </footer>

</body>
</html>
